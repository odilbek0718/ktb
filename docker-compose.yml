version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kutubxonam
      POSTGRES_PASSWORD: kutubxonam123
      POSTGRES_DB: kutubxonam
    ports:
      - "5432:5432"
    volumes:
      - kutubxonam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kutubxonam"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kutubxonam_pgdata:
